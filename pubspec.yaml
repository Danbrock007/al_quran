name: al_quran
description: A respectful Quran, Hadith, prayer, Qibla and referenced AI assistant app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  audioplayers: ^6.1.0
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#064E3B"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

