name: Build Al-Quran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Generate Android and iOS platform files
        run: |
          flutter create \
            --project-name al_quran \
            --org com.w3bco \
            --platforms=android,ios \
            .

      - name: Configure native permissions
        run: python3 tool/configure_platforms.py

      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("android/app/build.gradle.kts was not generated")

          text = path.read_text(encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              pattern = (
                  r"(compileOptions\s*\{.*?"
                  r"targetCompatibility\s*=\s*JavaVersion\.[^\n]+\n)"
              )
              text, count = re.subn(
                  pattern,
                  r"\1        isCoreLibraryDesugaringEnabled = true\n",
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(
                      "Could not locate compileOptions in build.gradle.kts"
                  )

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if dependency not in text:
              if re.search(r"(?m)^dependencies\s*\{", text):
                  text = re.sub(
                      r"(?m)^dependencies\s*\{",
                      "dependencies {\n    " + dependency,
                      text,
                      count=1,
                  )
              elif "\nflutter {" in text:
                  block = "\ndependencies {\n    " + dependency + "\n}\n"
                  text = text.replace("\nflutter {", block + "\nflutter {", 1)
              else:
                  text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          path.write_text(text, encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              raise SystemExit("Desugaring was not enabled")
          if dependency not in text:
              raise SystemExit("Desugaring dependency was not added")

          print("Core library desugaring configured successfully.")
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Quran-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
